services:
  wikitok:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wikitok
    restart: unless-stopped
    ports:
      - "${BIND_IP:-0.0.0.0}:${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
    # Security hardening for public internet exposure
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
